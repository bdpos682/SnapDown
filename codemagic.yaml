workflows:
  ios-device-unsigned:
    name: Build iOS IPA không ký
    max_build_duration: 60

    environment:
      flutter: 3.41.9
      xcode: latest

      vars:
        FLUTTER_BUILD_MODE: release

    scripts:

      # ============================================================
      # 1. KIỂM TRA MÔI TRƯỜNG
      # ============================================================
      - name: Check Environment
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " KIỂM TRA MÔI TRƯỜNG"
          echo "=========================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "CocoaPods:"
          pod --version

          echo ""
          echo "Thư mục hiện tại:"
          pwd


      # ============================================================
      # 2. CLEAN TOÀN BỘ BUILD CŨ
      # ============================================================
      - name: Clean Flutter Project
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " CLEAN FLUTTER PROJECT"
          echo "=========================================="

          flutter clean

          echo ""
          echo "Xóa build cũ..."

          rm -rf build

          echo ""
          echo "Xóa Pods cũ..."

          rm -rf ios/Pods
          rm -rf ios/.symlinks

          echo ""
          echo "Xóa DerivedData..."

          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

          echo ""
          echo "Flutter pub get..."

          flutter pub get

          echo ""
          echo "=========================================="
          echo " CLEAN HOÀN TẤT"
          echo "=========================================="


      # ============================================================
      # 3. FIX IOS DEPLOYMENT TARGET = 15.0
      # ============================================================
      - name: Fix iOS Deployment Target
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " FIX IOS DEPLOYMENT TARGET = 15.0"
          echo "=========================================="

          PODFILE_PATH="ios/Podfile"
          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          if [ ! -f "$PODFILE_PATH" ]; then
            echo "LỖI: Không tìm thấy ios/Podfile"
            exit 1
          fi

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "LỖI: Không tìm thấy project.pbxproj"
            exit 1
          fi

          echo ""
          echo "Sửa Podfile..."

          sed -i '' \
            "s/^# *platform :ios, .*/platform :ios, '15.0'/" \
            "$PODFILE_PATH"

          sed -i '' \
            "s/^platform :ios, .*/platform :ios, '15.0'/" \
            "$PODFILE_PATH"

          echo ""
          echo "Sửa Runner.xcodeproj..."

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT_FILE"

          echo ""
          echo "------------------------------------------"
          echo "Podfile platform:"
          echo "------------------------------------------"

          grep "platform :ios" "$PODFILE_PATH" || true

          echo ""
          echo "------------------------------------------"
          echo "Runner Deployment Target:"
          echo "------------------------------------------"

          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PROJECT_FILE" > /tmp/deployment_targets.txt || true
          head -20 /tmp/deployment_targets.txt || true

          echo ""
          echo "=========================================="
          echo " IOS MINIMUM = 15.0"
          echo "=========================================="


      # ============================================================
      # 4. PUB GET
      # ============================================================
      - name: Flutter Pub Get
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          echo ""
          echo "=========================================="
          echo " PUB GET HOÀN TẤT"
          echo "=========================================="


      # ============================================================
      # 5. REINSTALL COCOAPODS
      # ============================================================
      - name: Reinstall CocoaPods
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " REINSTALL COCOAPODS"
          echo "=========================================="

          flutter pub get

          cd ios

          echo ""
          echo "------------------------------------------"
          echo "Deintegrate Pods cũ"
          echo "------------------------------------------"

          pod deintegrate || true

          echo ""
          echo "Xóa Pods / symlink / Podfile.lock cũ..."

          rm -rf Pods
          rm -rf .symlinks
          rm -f Podfile.lock

          echo ""
          echo "Podfile platform:"

          grep "platform :ios" Podfile || true

          echo ""
          echo "------------------------------------------"
          echo "CÀI COCOAPODS"
          echo "------------------------------------------"

          pod install --repo-update

          echo ""
          echo "------------------------------------------"
          echo "KIỂM TRA PODFILE.LOCK"
          echo "------------------------------------------"

          if [ ! -f "Podfile.lock" ]; then
            echo "LỖI: Không tạo được Podfile.lock"
            exit 1
          fi

          echo "Pod install thành công."

          cd ..

          echo ""
          echo "=========================================="
          echo " COCOAPODS HOÀN TẤT"
          echo "=========================================="


      # ============================================================
      # 6. VERIFY PLUGINS
      # ============================================================
      - name: Verify Flutter Plugins
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY FLUTTER PLUGINS"
          echo "=========================================="

          echo ""
          echo "Kiểm tra audio_service..."

          if grep -q "audio_service" ios/Podfile.lock; then
            echo "OK: audio_service có trong Podfile.lock"
            grep "audio_service" ios/Podfile.lock || true
          else
            echo "LỖI: audio_service KHÔNG có trong Podfile.lock"
            exit 1
          fi

          echo ""
          echo "Kiểm tra ffmpeg_kit_flutter_new..."

          if grep -q "ffmpeg_kit_flutter_new" ios/Podfile.lock; then
            echo "OK: ffmpeg_kit_flutter_new có trong Podfile.lock"
            grep "ffmpeg_kit_flutter_new" ios/Podfile.lock || true
          else
            echo "LỖI: ffmpeg_kit_flutter_new KHÔNG có trong Podfile.lock"
            exit 1
          fi

          echo ""
          echo "Kiểm tra symlink audio_service..."

          if [ -d "ios/.symlinks/plugins/audio_service" ]; then
            echo "OK: audio_service symlink tồn tại"
          else
            echo "LỖI: Không tìm thấy audio_service symlink"
            exit 1
          fi

          echo ""
          echo "Kiểm tra symlink ffmpeg..."

          if [ -d "ios/.symlinks/plugins/ffmpeg_kit_flutter_new" ]; then
            echo "OK: ffmpeg symlink tồn tại"
          else
            echo "LỖI: Không tìm thấy ffmpeg symlink"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " PLUGINS OK"
          echo "=========================================="


      # ============================================================
      # 7. VERIFY WORKSPACE
      # ============================================================
      - name: Verify Xcode Workspace
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY XCODE WORKSPACE"
          echo "=========================================="

          if [ ! -d "ios/Runner.xcworkspace" ]; then
            echo "LỖI: Không tìm thấy ios/Runner.xcworkspace"
            exit 1
          fi

          if [ ! -d "ios/Pods" ]; then
            echo "LỖI: Không tìm thấy ios/Pods"
            exit 1
          fi

          if [ ! -f "ios/Podfile.lock" ]; then
            echo "LỖI: Không tìm thấy ios/Podfile.lock"
            exit 1
          fi

          echo "Runner.xcworkspace: OK"
          echo "Pods: OK"
          echo "Podfile.lock: OK"

          echo ""
          echo "=========================================="
          echo " WORKSPACE OK"
          echo "=========================================="


      # ============================================================
      # 8. BUILD IOS RELEASE UNSIGNED
      # ============================================================
      - name: Build iOS Unsigned
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILD IOS RELEASE UNSIGNED"
          echo "=========================================="

          flutter build ios \
            --release \
            --no-codesign

          echo ""
          echo "------------------------------------------"
          echo "KIỂM TRA RUNNER.APP"
          echo "------------------------------------------"

          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "LỖI:"
            echo "Không tìm thấy $APP_PATH"
            exit 1
          fi

          echo ""
          echo "Runner.app tồn tại."

          du -sh "$APP_PATH"

          echo ""
          echo "Kiểm tra executable Runner..."

          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "LỖI: Không tìm thấy Runner executable"
            exit 1
          fi

          ls -lh "$APP_PATH/Runner"

          echo ""
          echo "Kiểm tra Frameworks..."

          if [ ! -d "$APP_PATH/Frameworks" ]; then
            echo "LỖI: Không tìm thấy Frameworks"
            exit 1
          fi

          echo ""
          echo "Một số Frameworks:"

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type d \
            > /tmp/frameworks.txt

          head -30 /tmp/frameworks.txt

          echo ""
          echo "=========================================="
          echo " BUILD IOS THÀNH CÔNG"
          echo "=========================================="


      # ============================================================
      # 9. PACKAGE IPA
      # ============================================================
      - name: Package IPA
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " PACKAGE IPA"
          echo "=========================================="

          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ipa_output"
          IPA_PATH="$IPA_DIR/bdsnap.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy Runner.app"
            exit 1
          fi

          echo ""
          echo "Xóa IPA cũ..."

          rm -rf "$IPA_DIR"

          echo ""
          echo "Tạo Payload..."

          mkdir -p "$IPA_DIR/Payload"

          echo ""
          echo "Copy Runner.app..."

          cp -R \
            "$APP_PATH" \
            "$IPA_DIR/Payload/Runner.app"

          if [ ! -d "$IPA_DIR/Payload/Runner.app" ]; then
            echo "LỖI: Copy Runner.app thất bại"
            exit 1
          fi

          echo ""
          echo "Nén IPA..."

          (
            cd "$IPA_DIR"
            zip -qry bdsnap.ipa Payload
          )

          echo ""
          echo "Kiểm tra IPA..."

          if [ ! -f "$IPA_PATH" ]; then
            echo "LỖI: Không tạo được IPA"
            exit 1
          fi

          echo ""
          echo "IPA đã tạo:"

          ls -lh "$IPA_PATH"

          echo ""
          echo "Đọc cấu trúc IPA..."

          unzip -l "$IPA_PATH" > /tmp/ipa_contents.txt

          echo ""
          echo "50 file đầu tiên:"

          head -50 /tmp/ipa_contents.txt

          echo ""
          echo "Kiểm tra Runner executable..."

          if grep -q "Payload/Runner.app/Runner" /tmp/ipa_contents.txt; then
            echo "OK: Runner executable tồn tại"
          else
            echo "LỖI: Không tìm thấy Runner executable trong IPA"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Info.plist..."

          if grep -q "Payload/Runner.app/Info.plist" /tmp/ipa_contents.txt; then
            echo "OK: Info.plist tồn tại"
          else
            echo "LỖI: Không tìm thấy Info.plist"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Frameworks..."

          if grep -q "Payload/Runner.app/Frameworks/" /tmp/ipa_contents.txt; then
            echo "OK: Frameworks tồn tại"
          else
            echo "LỖI: Không tìm thấy Frameworks"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Flutter.framework..."

          if grep -q "Payload/Runner.app/Frameworks/Flutter.framework/" /tmp/ipa_contents.txt; then
            echo "OK: Flutter.framework tồn tại"
          else
            echo "LỖI: Không tìm thấy Flutter.framework"
            exit 1
          fi

          echo ""
          echo "Kiểm tra App.framework..."

          if grep -q "Payload/Runner.app/Frameworks/App.framework/" /tmp/ipa_contents.txt; then
            echo "OK: App.framework tồn tại"
          else
            echo "LỖI: Không tìm thấy App.framework"
            exit 1
          fi

          echo ""
          echo "Kiểm tra FFmpeg..."

          if grep -q "libavformat.framework" /tmp/ipa_contents.txt; then
            echo "OK: FFmpeg framework tồn tại"
          else
            echo "CẢNH BÁO: Không tìm thấy libavformat.framework"
          fi

          echo ""
          echo "Kiểm tra just_audio..."

          if grep -q "just_audio.framework" /tmp/ipa_contents.txt; then
            echo "OK: just_audio.framework tồn tại"
          else
            echo "CẢNH BÁO: Không tìm thấy just_audio.framework"
          fi

          echo ""
          echo "Xóa Payload tạm..."

          rm -rf "$IPA_DIR/Payload"

          echo ""
          echo "=========================================="
          echo " IPA TẠO THÀNH CÔNG"
          echo "=========================================="

          ls -lh "$IPA_PATH"


      # ============================================================
      # 10. FINAL CHECK IPA
      # ============================================================
      - name: Final Check
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " FINAL CHECK IPA"
          echo "=========================================="

          IPA_PATH="build/ipa_output/bdsnap.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "LỖI: IPA không tồn tại"
            exit 1
          fi

          echo ""
          echo "IPA tồn tại."

          FILE_SIZE=$(stat -f%z "$IPA_PATH")

          echo ""
          echo "Dung lượng IPA:"
          ls -lh "$IPA_PATH"

          echo ""
          echo "Dung lượng byte:"
          echo "$FILE_SIZE"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo ""
            echo "LỖI:"
            echo "IPA nhỏ hơn 1 MB."
            echo "Có khả năng build không đầy đủ."
            exit 1
          fi

          echo ""
          echo "Đọc danh sách file IPA..."

          unzip -l "$IPA_PATH" > /tmp/final_ipa_contents.txt

          echo ""
          echo "Kiểm tra cấu trúc Payload..."

          if grep -q "Payload/Runner.app/" /tmp/final_ipa_contents.txt; then
            echo "OK: Payload/Runner.app tồn tại"
          else
            echo "LỖI: Cấu trúc IPA không hợp lệ"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Runner..."

          if grep -q "Payload/Runner.app/Runner" /tmp/final_ipa_contents.txt; then
            echo "OK: Runner executable"
          else
            echo "LỖI: Runner executable không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Flutter.framework..."

          if grep -q "Payload/Runner.app/Frameworks/Flutter.framework/" /tmp/final_ipa_contents.txt; then
            echo "OK: Flutter.framework"
          else
            echo "LỖI: Flutter.framework không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra App.framework..."

          if grep -q "Payload/Runner.app/Frameworks/App.framework/" /tmp/final_ipa_contents.txt; then
            echo "OK: App.framework"
          else
            echo "LỖI: App.framework không tồn tại"
            exit 1
          fi

          echo ""
          echo "Một số framework có trong IPA:"

          grep "Payload/Runner.app/Frameworks/" \
            /tmp/final_ipa_contents.txt \
            > /tmp/framework_list.txt || true

          head -40 /tmp/framework_list.txt || true

          echo ""
          echo "=========================================="
          echo " BUILD HOÀN TẤT THÀNH CÔNG"
          echo "=========================================="

          echo ""
          echo "IPA:"
          echo "$IPA_PATH"

          echo ""

          ls -lh "$IPA_PATH"


    artifacts:
      - build/ipa_output/bdsnap.ipa