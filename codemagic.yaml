workflows:
  ios-device-unsigned:
    name: Build iOS IPA không ký
    max_build_duration: 60

    environment:
      flutter: 3.41.9
      xcode: latest

      vars:
        FLUTTER_BUILD_MODE: release

    scripts:

      # ============================================================
      # 1. KIỂM TRA MÔI TRƯỜNG
      # ============================================================
      - name: Check Environment
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " KIỂM TRA MÔI TRƯỜNG"
          echo "=========================================="

          flutter --version
          dart --version
          xcodebuild -version
          pod --version

          echo ""
          echo "PWD:"
          pwd


      # ============================================================
      # 2. CLEAN
      # ============================================================
      - name: Clean Project
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " CLEAN PROJECT"
          echo "=========================================="

          flutter clean

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks

          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

          flutter pub get

          echo ""
          echo "CLEAN OK"


      # ============================================================
      # 3. IOS DEPLOYMENT TARGET = 15
      # ============================================================
      - name: Fix iOS Deployment Target
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " IOS DEPLOYMENT TARGET = 15.0"
          echo "=========================================="

          PODFILE="ios/Podfile"
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          if [ ! -f "$PODFILE" ]; then
            echo "Không tìm thấy $PODFILE"
            exit 1
          fi

          if [ ! -f "$PROJECT" ]; then
            echo "Không tìm thấy $PROJECT"
            exit 1
          fi

          # Nếu platform đang comment
          sed -i '' \
            "s/^# *platform :ios, .*/platform :ios, '15.0'/" \
            "$PODFILE"

          # Nếu platform đang bật
          sed -i '' \
            "s/^platform :ios, .*/platform :ios, '15.0'/" \
            "$PODFILE"

          # Runner minimum target
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT"

          echo ""
          echo "Podfile:"
          grep "platform :ios" "$PODFILE" || true

          echo ""
          echo "Deployment target:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PROJECT" \
            > /tmp/deployment_targets.txt || true

          head -20 /tmp/deployment_targets.txt || true


      # ============================================================
      # 4. PUB GET
      # ============================================================
      - name: Flutter Pub Get
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get


      # ============================================================
      # 5. COCOAPODS
      # ============================================================
      - name: Reinstall CocoaPods
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " REINSTALL COCOAPODS"
          echo "=========================================="

          cd ios

          pod deintegrate || true

          rm -rf Pods
          rm -rf .symlinks
          rm -f Podfile.lock

          echo ""
          echo "Platform:"
          grep "platform :ios" Podfile || true

          echo ""
          echo "Cài Pods..."

          pod install --repo-update

          if [ ! -f "Podfile.lock" ]; then
            echo "Không tạo được Podfile.lock"
            exit 1
          fi

          cd ..

          echo ""
          echo "COCOAPODS OK"


      # ============================================================
      # 6. VERIFY PLUGINS
      # ============================================================
      - name: Verify Plugins
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY PLUGINS"
          echo "=========================================="

          if grep -q "audio_service" ios/Podfile.lock; then
            echo "OK: audio_service"
          else
            echo "LỖI: audio_service không có trong Podfile.lock"
            exit 1
          fi

          if grep -q "ffmpeg_kit_flutter_new" ios/Podfile.lock; then
            echo "OK: ffmpeg_kit_flutter_new"
          else
            echo "LỖI: ffmpeg_kit_flutter_new không có trong Podfile.lock"
            exit 1
          fi

          if [ ! -d "ios/.symlinks/plugins/audio_service" ]; then
            echo "LỖI: thiếu symlink audio_service"
            exit 1
          fi

          if [ ! -d "ios/.symlinks/plugins/ffmpeg_kit_flutter_new" ]; then
            echo "LỖI: thiếu symlink ffmpeg"
            exit 1
          fi

          echo ""
          echo "PLUGINS OK"


      # ============================================================
      # 7. VERIFY XCODE WORKSPACE
      # ============================================================
      - name: Verify Workspace
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY WORKSPACE"
          echo "=========================================="

          if [ ! -d "ios/Runner.xcworkspace" ]; then
            echo "Không tìm thấy Runner.xcworkspace"
            exit 1
          fi

          if [ ! -d "ios/Pods" ]; then
            echo "Không tìm thấy Pods"
            exit 1
          fi

          if [ ! -f "ios/Podfile.lock" ]; then
            echo "Không tìm thấy Podfile.lock"
            exit 1
          fi

          echo "WORKSPACE OK"


      # ============================================================
      # 8. BUILD IOS DEVICE - TẮT HOÀN TOÀN CODE SIGNING
      # ============================================================
      - name: Build iOS Unsigned
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " BUILD IOS DEVICE UNSIGNED"
          echo "=========================================="

          DERIVED_DATA="$PWD/build/ios_unsigned"

          rm -rf "$DERIVED_DATA"

          echo ""
          echo "Build Runner bằng Xcode..."
          echo "CODE SIGNING = OFF"
          echo ""

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build

          echo ""
          echo "=========================================="
          echo " XCODE BUILD HOÀN TẤT"
          echo "=========================================="

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "LỖI: Không tìm thấy Runner.app tại:"
            echo "$APP_PATH"
            echo ""
            exit 1
          fi

          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "LỖI: Không tìm thấy Runner executable"
            exit 1
          fi

          if [ ! -d "$APP_PATH/Frameworks" ]; then
            echo "LỖI: Không tìm thấy Frameworks"
            exit 1
          fi

          echo ""
          echo "Runner.app:"
          echo "$APP_PATH"

          echo ""
          echo "Dung lượng Runner.app:"
          du -sh "$APP_PATH"

          echo ""
          echo "Runner:"
          ls -lh "$APP_PATH/Runner"

          echo ""
          echo "Danh sách framework:"

          find "$APP_PATH/Frameworks" \
            -maxdepth 1 \
            -type d \
            > /tmp/frameworks.txt

          head -40 /tmp/frameworks.txt

          echo ""
          echo "=========================================="
          echo " BUILD IOS UNSIGNED THÀNH CÔNG"
          echo "=========================================="


      # ============================================================
      # 9. PACKAGE IPA
      # ============================================================
      - name: Package IPA
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " PACKAGE IPA"
          echo "=========================================="

          APP_PATH="$PWD/build/ios_unsigned/Build/Products/Release-iphoneos/Runner.app"

          IPA_DIR="$PWD/build/ipa_output"
          IPA_PATH="$IPA_DIR/bdsnap.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy Runner.app"
            echo "$APP_PATH"
            exit 1
          fi

          rm -rf "$IPA_DIR"

          mkdir -p "$IPA_DIR/Payload"

          echo ""
          echo "Copy Runner.app..."

          cp -R \
            "$APP_PATH" \
            "$IPA_DIR/Payload/Runner.app"

          if [ ! -d "$IPA_DIR/Payload/Runner.app" ]; then
            echo "Copy Runner.app thất bại"
            exit 1
          fi

          echo ""
          echo "Nén IPA..."

          (
            cd "$IPA_DIR"
            zip -qry bdsnap.ipa Payload
          )

          if [ ! -f "$IPA_PATH" ]; then
            echo "Không tạo được IPA"
            exit 1
          fi

          echo ""
          echo "IPA:"
          ls -lh "$IPA_PATH"

          echo ""
          echo "Đọc nội dung IPA..."

          unzip -l "$IPA_PATH" > /tmp/ipa_contents.txt

          head -50 /tmp/ipa_contents.txt

          echo ""
          echo "Kiểm tra Runner..."

          if grep -q "Payload/Runner.app/Runner" /tmp/ipa_contents.txt; then
            echo "OK: Runner"
          else
            echo "LỖI: Runner không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Info.plist..."

          if grep -q "Payload/Runner.app/Info.plist" /tmp/ipa_contents.txt; then
            echo "OK: Info.plist"
          else
            echo "LỖI: Info.plist không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Frameworks..."

          if grep -q "Payload/Runner.app/Frameworks/" /tmp/ipa_contents.txt; then
            echo "OK: Frameworks"
          else
            echo "LỖI: Frameworks không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra Flutter.framework..."

          if grep -q "Payload/Runner.app/Frameworks/Flutter.framework/" /tmp/ipa_contents.txt; then
            echo "OK: Flutter.framework"
          else
            echo "LỖI: Flutter.framework không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra App.framework..."

          if grep -q "Payload/Runner.app/Frameworks/App.framework/" /tmp/ipa_contents.txt; then
            echo "OK: App.framework"
          else
            echo "LỖI: App.framework không tồn tại"
            exit 1
          fi

          echo ""
          echo "Kiểm tra FFmpeg..."

          if grep -q "libavformat.framework" /tmp/ipa_contents.txt; then
            echo "OK: libavformat.framework"
          else
            echo "CẢNH BÁO: Không tìm thấy libavformat.framework"
          fi

          echo ""
          echo "Kiểm tra just_audio..."

          if grep -q "just_audio.framework" /tmp/ipa_contents.txt; then
            echo "OK: just_audio.framework"
          else
            echo "CẢNH BÁO: Không tìm thấy just_audio.framework"
          fi

          echo ""
          echo "Xóa Payload tạm..."

          rm -rf "$IPA_DIR/Payload"

          echo ""
          echo "=========================================="
          echo " IPA TẠO THÀNH CÔNG"
          echo "=========================================="

          ls -lh "$IPA_PATH"


      # ============================================================
      # 10. FINAL CHECK
      # ============================================================
      - name: Final Check
        script: |
          set -euo pipefail

          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          IPA_PATH="$PWD/build/ipa_output/bdsnap.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "LỖI: IPA không tồn tại"
            exit 1
          fi

          FILE_SIZE=$(stat -f%z "$IPA_PATH")

          echo ""
          echo "IPA:"
          ls -lh "$IPA_PATH"

          echo ""
          echo "Size:"
          echo "$FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "LỖI: IPA nhỏ bất thường (< 1MB)"
            exit 1
          fi

          unzip -l "$IPA_PATH" > /tmp/final_ipa.txt

          if ! grep -q "Payload/Runner.app/Runner" /tmp/final_ipa.txt; then
            echo "LỖI: thiếu Runner"
            exit 1
          fi

          if ! grep -q "Payload/Runner.app/Frameworks/Flutter.framework/" /tmp/final_ipa.txt; then
            echo "LỖI: thiếu Flutter.framework"
            exit 1
          fi

          if ! grep -q "Payload/Runner.app/Frameworks/App.framework/" /tmp/final_ipa.txt; then
            echo "LỖI: thiếu App.framework"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " BUILD THÀNH CÔNG"
          echo "=========================================="

          echo ""
          echo "$IPA_PATH"
          echo ""

          ls -lh "$IPA_PATH"


    artifacts:
      - build/ipa_output/bdsnap.ipa